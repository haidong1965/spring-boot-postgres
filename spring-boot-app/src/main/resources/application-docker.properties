# Database Configuration for Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/token_auth_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Maximum size of a single file (e.g., 10MB, 50MB, 1GB)
spring.servlet.multipart.max-file-size=500MB
# Maximum size of the entire HTTP request (useful if uploading multiple files at once)
spring.servlet.multipart.max-request-size=500MB

# Disable DevTools features by default
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

jwt.secret=your-secret-key-for-jwt-token-generation-1234567890
# 5 hous : 5x60x60x1000
jwt.expiration=18000000

# Actuator endpoints
management.server.address=0.0.0.0
management.server.port=8080
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.customEndpoint.enabled=true 
# Enable Prometheus metric export (default: true)
management.prometheus.metrics.export.enabled=true

