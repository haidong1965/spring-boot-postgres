spring.application.name=spring-boot-app

server.address=0.0.0.0
# Server
server.port=8445
server.public=2.106.164.55
server.private=192.168.1.81
client.port=5175

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:cert.p12
server.ssl.key-store-password=changeit
server.ssl.enabled=true

admin.name=${ADMIN_NAME}
admin.password=${ADMIN_PASSWORD}

# Maximum size of a single file (e.g., 10MB, 50MB, 1GB)
spring.servlet.multipart.max-file-size=900MB
# Maximum size of the entire HTTP request (useful if uploading multiple files at once)
spring.servlet.multipart.max-request-size=900MB

# Enable DevTools features only when the 'dev' profile is active
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Expose httptrace
management.endpoints.web.exposure.include=httptrace,health,info
management.endpoint.httptrace.enabled=true
management.trace.http.include=REQUEST_HEADERS,RESPONSE_HEADERS,COOKIE_HEADERS
management.endpoints.web.base-path=/actuator

#management.endpoint.beans.enabled=true

#seconds, 24*60*60 = 86400
server.servlet.session.timeout=120
server.servlet.session.cookie.name=MY_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

logging.file.name=logs/webapp.log
logging.level.root=ERROR
