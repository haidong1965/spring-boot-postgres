# Maximum size of a single file (e.g., 10MB, 50MB, 1GB)
spring.servlet.multipart.max-file-size=900MB
# Maximum size of the entire HTTP request (useful if uploading multiple files at once)
spring.servlet.multipart.max-request-size=900MB

# Enable DevTools features only when the 'dev' profile is active
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===================================================================
# 2. MANAGEMENT SERVER (Internal / Actuator)
# ===================================================================
# Runs on a separate port to isolate management traffic
management.server.port=8080

# CRITICAL: Binds ONLY to localhost. 
# This prevents external users from accessing actuator endpoints directly.
# It also allows us to use plain HTTP without SSL certificates.
management.server.address=192.168.1.84
# Expose httptrace, info
management.httpexchanges.recording.include=REQUEST_HEADERS,RESPONSE_HEADERS,COOKIE_HEADERS
management.endpoints.web.base-path=/actuator
# Show all info endpoints data (disable sensitive filtering for info)
#management.endpoint.info.enabled=true
#management.endpoint.info.show-details=always
management.endpoint.health.show-details: always
# Force the management server to use plain HTTP, ignoring global SSL settings
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=*
management.endpoint.customEndpoint.enabled=true 
# Enable Prometheus metric export (default: true)
management.prometheus.metrics.export.enabled=true



#management.endpoint.beans.enabled=true

# 1. Log Spring's Transaction Manager (Shows @Transactional start/commit/rollback)
logging.level.org.springframework.transaction=OFF
logging.level.org.springframework.jdbc.datasource=OFF

# 2. Log Hibernate's internal transaction coordinator
logging.level.org.hibernate.resource.transaction=OFF

# 3. (Optional) Log the actual SQL so you can see what runs inside the TX
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

#seconds, 24*60*60 = 86400
server.servlet.session.timeout=120
server.servlet.session.cookie.name=MY_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

logging.file.name=logs/webapp.log
logging.level.root=WARN
logging.level.hd.webapp=DEBUG

