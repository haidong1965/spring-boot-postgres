
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: springboot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-token_auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Windows path - use relative path or ./postgres_data
      - postgres_data:/var/lib/postgresql/data
      # Mount init script - Windows path with forward slashes
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - spring-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Application
  spring-app:
    build:
      context: ./spring-boot-app
      dockerfile: Dockerfile.multistage
    container_name: springboot_app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-token_auth_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-for-jwt-token-generation-1234567890}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8080:8080"
    networks:
      - spring-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Windows - use ./logs relative path
    volumes:
      - ./logs:/app/logs

networks:
  spring-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local